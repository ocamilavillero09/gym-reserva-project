server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida devuelve index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API: el navegador llama /api/... y nginx lo reenvía al
    # Service "backend" del cluster de Kubernetes. Así el frontend no necesita
    # conocer la IP del backend ni exponerlo fuera del cluster.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentación Swagger del backend (opcional, útil para la demo).
    location /swagger/ {
        proxy_pass http://backend:8000/swagger/;
        proxy_set_header Host $host;
    }
}
