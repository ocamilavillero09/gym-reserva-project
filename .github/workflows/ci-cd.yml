name: CI/CD

# Se ejecuta al hacer push a main (ignora cambios solo de manifiestos o docs
# para no entrar en bucle cuando el propio pipeline actualiza el tag en k8s/).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write   # necesario para que el job de deploy commitee el nuevo tag

env:
  DOCKERHUB_USER: ocamilavillero09
  BACKEND_IMAGE: ocamilavillero09/gym-backend
  FRONTEND_IMAGE: ocamilavillero09/gym-frontend

jobs:
  # ── 1) Pruebas unitarias (backend + frontend) ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backend — pruebas unitarias + cobertura
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          coverage run manage.py test api -v 2
          coverage report

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend — pruebas unitarias (Vitest) + cobertura
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

  # ── 2) Pruebas E2E (Playwright) contra el stack completo en docker compose ──
  #     Informativo: no bloquea la publicación (el requisito son las unitarias).
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Levantar stack (front + back + mongo)
        run: docker compose up -d --build
      - name: Esperar a que el backend responda
        run: |
          for i in $(seq 1 50); do
            curl -sf http://localhost:8000/api/slots/ >/dev/null && break
            sleep 3
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright + navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Ejecutar E2E
        working-directory: frontend
        run: npx playwright test
      - name: Apagar stack
        if: always()
        run: docker compose down -v

  # ── 3) Build + push de imágenes a Docker Hub (si pasan las pruebas unitarias) ──
  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  # ── 3) Entrega continua: actualiza el tag en k8s/ y lo commitea ──
  #     ArgoCD detecta el cambio y despliega esa imagen en minikube.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Fijar el tag de la imagen al SHA del commit
        working-directory: k8s
        run: |
          kustomize edit set image ${{ env.BACKEND_IMAGE }}=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          kustomize edit set image ${{ env.FRONTEND_IMAGE }}=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Commit del manifiesto actualizado (lo toma ArgoCD)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "ci: despliega imágenes ${{ github.sha }} [skip ci]" || echo "sin cambios"
          git push
